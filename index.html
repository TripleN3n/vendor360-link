<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VENDOR360</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       font:15px/1.6 Inter,system-ui,Segoe UI,Arial,sans-serif;
       background:#fbfaf8;color:#18181b}
  .c{text-align:center;max-width:32rem;padding:2rem}
  .m{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#3d0b8a}
  .m span{color:#b026ff}
  .s{margin-top:.75rem;color:#71717a;font-size:13.5px}
  a{color:#6a15c4}
</style>
</head>
<body>
  <div class="c">
    <div class="m">VENDOR<span>360</span></div>
    <p class="s" id="msg">Taking you to the portal&hellip;</p>
    <p class="s" id="alt"></p>
    <noscript>
      <p class="s">JavaScript is switched off. The live address is in
      <a href="target.json">target.json</a>.</p>
    </noscript>
  </div>
<script>
// Always ask for the live target, never a cached one.
fetch("target.json?t=" + Date.now(), {cache: "no-store"})
  .then(function (r) { return r.json(); })
  .then(function (d) {
    if (!d || !d.url) throw new Error("no target");
    document.getElementById("alt").innerHTML =
      'If nothing happens, <a href="' + d.url + '">open it here</a>.';
    location.replace(d.url);
  })
  .catch(function () {
    document.getElementById("msg").textContent =
      "VENDOR360 is not running right now.";
    document.getElementById("alt").textContent =
      "It runs on a laptop that has to be switched on. Try again shortly.";
  });
</script>
</body>
</html>
