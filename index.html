<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VENDOR360</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       font:15px/1.6 Inter,system-ui,Segoe UI,Arial,sans-serif;
       background:#fbfaf8;color:#18181b}
  .c{text-align:center;max-width:34rem;padding:2rem}
  .m{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#3d0b8a}
  .m span{color:#b026ff}
  .s{margin-top:.75rem;color:#71717a;font-size:13.5px}
  .d{display:inline-block;width:8px;height:8px;border-radius:50%;background:#b026ff;
     margin-right:.5rem;vertical-align:middle;animation:p 1.2s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
  a{color:#6a15c4}
</style>
</head>
<body>
  <div class="c">
    <div class="m">VENDOR<span>360</span></div>
    <p class="s" id="msg"><span class="d"></span>Connecting to the portal&hellip;</p>
    <p class="s" id="alt"></p>
    <noscript>
      <p class="s">JavaScript is switched off. The live address is in
      <a href="target.json">target.json</a>.</p>
    </noscript>
  </div>
<script>
// This page is the permanent address. The portal itself lives behind a tunnel
// whose hostname changes whenever it restarts, so the job here is: find the
// current hostname, make sure it is actually answering, and only then go.
//
// Two places know the hostname. GitHub's API reads the repo directly and is
// fresh within a minute, but allows 60 calls an hour per visitor, so it is
// asked at most every 20 seconds. The Pages copy of target.json sits behind a
// CDN that ignores cache-busting and can lag up to ten minutes; it is the
// fallback. Whichever answers, the hostname is probed by loading a small image
// from it: a live tunnel serves the picture, a dead one serves Cloudflare's
// error page, which is not a picture. No redirect happens until that succeeds,
// so a visitor is never dropped onto an error page and this tab keeps trying.
var API = "https://api.github.com/repos/TripleN3n/vendor360-link/contents/target.json?ref=master";
var PROBE = "/vista-logo.png";
var msg = document.getElementById("msg"), alt = document.getElementById("alt");
var lastApi = 0, attempt = 0;

function show(text, detail) {
  msg.innerHTML = '<span class="d"></span>' + text;
  alt.innerHTML = detail || "";
}
function fromApi() {
  var now = Date.now();
  if (now - lastApi < 20000) return Promise.reject(new Error("api throttled"));
  lastApi = now;
  return fetch(API, {cache: "no-store"})
    .then(function (r) { if (!r.ok) throw new Error("api " + r.status); return r.json(); })
    .then(function (d) { return JSON.parse(atob(String(d.content || "").replace(/
/g, ""))); });
}
function fromPages() {
  return fetch("target.json?t=" + Date.now(), {cache: "no-store"})
    .then(function (r) { return r.json(); });
}
function probe(url) {
  return new Promise(function (ok, bad) {
    var img = new Image();
    var timer = setTimeout(function () { img.src = ""; bad(); }, 8000);
    img.onload = function () { clearTimeout(timer); ok(); };
    img.onerror = function () { clearTimeout(timer); bad(); };
    img.src = url + PROBE + "?t=" + Date.now();
  });
}
function again(text, url) {
  var link = url ? ' <a href="' + url + '">Try the current address anyway</a>.' : "";
  show(text,
    "This page keeps checking and opens the portal the moment it is back. " +
    "Keep the tab open. Bookmark <b>this</b> address - it never changes." + link);
  setTimeout(tick, attempt < 12 ? 5000 : 15000);
}
function tick() {
  attempt++;
  fromApi().catch(fromPages)
    .then(function (d) {
      if (!d || !d.url) throw new Error("no target");
      return probe(d.url).then(
        function () { show("Connected. Opening the portal&hellip;"); location.replace(d.url); },
        function () { again("VENDOR360 is reconnecting&hellip;", d.url); });
    })
    .catch(function () { again("Looking for VENDOR360&hellip;", null); });
}
tick();
</script>
</body>
</html>
